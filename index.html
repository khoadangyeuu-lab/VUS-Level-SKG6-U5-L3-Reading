<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Look 4: Unit 5 – L3 Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E2B4F; --ink-soft:#5A6788;
  --paper:#F2F7FF; --grid:#DFEAFB; --card:#FFFFFF; --line:#D4E0F3;
  --sun:#FFC93C; --sun-deep:#D9A112;
  --grass:#25A96A; --grass-deep:#1A7F4F;
  --berry:#E5484D; --berry-deep:#B32F34;
  --c-exciting:#E0662B; --c-dangerous:#3F6FB5; --c-important:#C28E0E; --c-popular:#B5527F;
  --r-lg:28px; --r-md:18px; --r-sm:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px; min-height:100dvh; -webkit-tap-highlight-color:transparent; overflow-x:clip;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:10px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px clamp(16px,4vw,40px)}
.brand{display:flex;align-items:center;gap:14px}
.brand-badge{width:52px;height:52px;border-radius:16px;background:var(--sun);box-shadow:0 5px 0 var(--sun-deep);display:grid;place-items:center;flex:none}
.brand-badge svg{width:30px;height:30px}
.brand small{display:block;font-weight:800;color:var(--ink-soft);font-size:.9rem;letter-spacing:.01em}
.brand h1{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.3rem,2.6vw,1.75rem);line-height:1.1}
.tabs{display:flex;background:#fff;border:2px solid var(--line);box-shadow:0 5px 0 var(--line);border-radius:999px;padding:5px;gap:4px}
.tab{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;padding:10px 20px;border-radius:999px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;transition:background .2s,color .2s}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0E1630}
.tab:not([aria-selected="true"]):hover{color:var(--ink);background:var(--paper)}
main{padding:0 clamp(16px,4vw,40px) 32px}
.view[hidden]{display:none}

/* chunky buttons */
.btn{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.05rem;display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:999px;background:#fff;border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s,background .2s}
.btn svg{width:20px;height:20px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.is-on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 4px 0 #0E1630}
.btn-primary{background:var(--sun);border-color:var(--sun-deep);box-shadow:0 5px 0 var(--sun-deep);font-size:1.2rem;padding:14px 28px}
.btn-primary:active{box-shadow:0 2px 0 var(--sun-deep)}
.btn-icon{padding:11px;border-radius:50%}
.sound-toggle{position:fixed;right:18px;bottom:18px;z-index:10;background:#fff}

/* photos */
.ph{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px);object-fit:cover;border-radius:16px;pointer-events:none;user-select:none}

/* flashcards: 4 words, 2 x 2 */
.toolbar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:4px auto 22px}
.toolbar .hint{color:var(--ink-soft);font-weight:700;margin-left:8px}
.deck{--w:min(900px,max(520px,calc((100dvh - 260px) * 1.2 + 20px)));width:min(100%,var(--w));margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.fc{perspective:1200px;aspect-ratio:5/4;position:relative;transition:transform .15s}
.fc:hover{transform:translateY(-5px)}
.deck.dealing .fc{animation:deal .5s cubic-bezier(.3,1.4,.5,1) both;animation-delay:calc(var(--i) * 45ms)}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.4,.5,1)}
.fc.is-word .fc-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:var(--r-lg);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.face-pic{background:var(--card);border:3px solid color-mix(in srgb,var(--c) 30%,white);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 30%,white)}
.face-pic .ph{inset:7px;width:calc(100% - 14px);height:calc(100% - 14px);border-radius:19px}
.face-word{transform:rotateY(180deg);background:var(--c);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 70%,black);color:#fff;container-type:inline-size}
.face-word span{font-family:"Fredoka",sans-serif;font-weight:700;font-size:min(15cqw,4.6rem);letter-spacing:.01em;text-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black)}
.avatar{position:absolute;left:14px;top:14px;width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,black);pointer-events:none}
.speak{position:absolute;right:12px;bottom:12px;z-index:2;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.26);display:grid;place-items:center;color:#fff;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .15s,visibility 0s}
.fc.is-word .speak{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .2s .3s,visibility 0s .3s}
.speak:hover{background:rgba(255,255,255,.42)}
.speak:active{transform:translateY(2px)}
.speak svg{width:22px;height:22px}
.fc button.flip{position:absolute;inset:0;border-radius:var(--r-lg);z-index:1}

/* game */
.game{width:min(100%,980px);margin:0 auto}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.round-label{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.25rem;display:flex;align-items:center;gap:12px}
.chip{font-weight:800;font-size:.9rem;padding:6px 12px;border-radius:999px;background:#fff;border:2px solid var(--line);display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.dots{display:flex;gap:7px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:#fff;border:2px solid var(--line);transition:all .25s}
.dot.word{border-radius:4px}
.dot.cur{border-color:var(--ink);transform:scale(1.25)}
.dot.ok{background:var(--grass);border-color:var(--grass)}
.dot.no{background:var(--berry);border-color:var(--berry)}
.score{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.score svg{width:26px;height:26px}
.score.bump{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.stage-wrap{position:relative}
.stage{--w:min(1000px,max(520px,calc((100dvh - 440px) * 4 + 48px)));width:min(100%,var(--w));margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.tile{aspect-ratio:1/1;border-radius:22px;display:grid;place-items:center;position:relative;background:#fff;border:3px solid color-mix(in srgb,var(--c) 30%,white);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 30%,white)}
.tile .ph{inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:15px}
.tile.word{background:var(--c);border-color:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 70%,black);color:#fff;container-type:inline-size}
.tile.word span{font-family:"Fredoka",sans-serif;font-weight:700;font-size:min(15cqw,3rem);text-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,black)}
.tile.missing{background:repeating-linear-gradient(-45deg,#fff 0 14px,var(--paper) 14px 28px);border:3px dashed var(--ink-soft);box-shadow:none}
.tile.missing b{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(3rem,8vw,6rem);line-height:1;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-6deg)}}
.tile.reveal{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tile.reveal::after{content:"";position:absolute;inset:-9px;border-radius:28px;border:4px solid var(--grass);pointer-events:none}
.tile.reveal.wrong::after{border-color:var(--berry)}
.stage.dealing .tile{animation:deal .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes deal{from{opacity:0;transform:translateY(18px) scale(.9)}}
.curtain{position:absolute;inset:-12px;border-radius:30px;background:var(--ink);color:#fff;display:grid;place-items:center;text-align:center;z-index:5;transform:scaleY(0);transform-origin:top;transition:transform .45s cubic-bezier(.6,0,.3,1);pointer-events:none}
.curtain.down{transform:scaleY(1);pointer-events:auto}
.curtain-inner{opacity:0;transition:opacity .2s}
.curtain.down .curtain-inner{opacity:1;transition-delay:.3s}
.curtain svg{width:120px;height:60px;margin-bottom:10px}
.curtain p{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.8rem,4vw,3rem)}
.curtain .count{font-family:"Fredoka",sans-serif;font-size:1.4rem;opacity:.75;margin-top:6px}
.panel{margin-top:26px;text-align:center;min-height:170px}
.question{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.5rem,3vw,2rem);margin-bottom:14px}
.look-copy{color:var(--ink-soft);font-weight:700;font-size:1.1rem;margin-bottom:16px}
.options{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.opt{background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:20px;position:relative;transition:transform .08s,box-shadow .08s,border-color .2s}
.opt:hover{border-color:var(--ink-soft)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.pic{width:clamp(88px,12dvh,120px);aspect-ratio:1/1;display:grid;place-items:center}
.opt.pic .ph{inset:5px;width:calc(100% - 10px);height:calc(100% - 10px);border-radius:14px}
.opt.txt{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.4rem,3vw,2rem);padding:16px 34px;min-width:150px}
.opt .key{position:absolute;top:-10px;left:-10px;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;font-family:"Nunito",sans-serif;font-weight:800;font-size:.85rem;display:grid;place-items:center;z-index:2}
.opt.ok{border-color:var(--grass);box-shadow:0 6px 0 var(--grass-deep);background:#E6F7EE}
.opt.no{border-color:var(--berry);box-shadow:0 6px 0 var(--berry-deep);background:#FDECEC;animation:shake .4s}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.ok):not(.no){opacity:.45}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.feedback{font-family:"Fredoka",sans-serif;font-weight:600;font-size:1.35rem;margin:18px 0 12px;min-height:1.7em;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.feedback .btn{color:var(--ink)}
.feedback.good{color:var(--grass-deep)}
.feedback.bad{color:var(--berry-deep)}

/* confetti */
.confetti{position:absolute;width:0;height:0;pointer-events:none;z-index:8}
.confetti i{position:absolute;left:0;top:0;width:10px;height:15px;border-radius:3px;background:var(--k);animation:fly .95s cubic-bezier(.2,.8,.3,1) forwards;animation-delay:var(--d)}
@keyframes fly{0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r)) scale(1);opacity:0}}

/* end screen */
.result{position:relative;width:min(100%,560px);margin:30px auto 0;background:#fff;border-radius:32px;border:3px solid var(--line);box-shadow:0 8px 0 var(--line);padding:40px 28px;text-align:center}
.stars{display:flex;justify-content:center;gap:10px;margin-bottom:12px}
.stars svg{width:62px;height:62px}
.stars svg:nth-child(2){transform:translateY(-14px);width:76px;height:76px}
.stars .on{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stars .on:nth-child(2){animation-delay:.15s}
.stars .on:nth-child(3){animation-delay:.3s}
.result h2{font-family:"Fredoka",sans-serif;font-weight:700;font-size:2.4rem}
.result p{font-size:1.2rem;font-weight:700;color:var(--ink-soft);margin:6px 0 26px}
.result .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* Guess it! */
.gz-stage{display:grid;grid-template-columns:auto minmax(0,1fr);gap:30px;align-items:center;justify-content:center;margin:0 auto;max-width:900px;padding-bottom:22px}
.mystery{width:clamp(190px,calc(100dvh - 500px),300px)}
.mystery .cap{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);z-index:3;background:var(--c);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;font-size:1.25rem;padding:6px 20px;border-radius:999px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,black);white-space:nowrap}
.clue-card{position:relative;text-align:left;background:#fff;border:3px solid var(--line);box-shadow:0 7px 0 var(--line);border-radius:var(--r-lg);padding:22px 76px 24px 28px}
.clue-card::before{content:"";position:absolute;left:-13px;top:50%;width:22px;height:22px;background:#fff;border-left:3px solid var(--line);border-bottom:3px solid var(--line);transform:translateY(-50%) rotate(45deg)}
.clue-card .chip{margin-bottom:12px}
.clue-text{font-weight:800;font-size:clamp(1.15rem,2vw,1.5rem);line-height:1.35;margin-bottom:10px}
.clue-q{font-family:"Fredoka",sans-serif;font-weight:700;font-size:clamp(1.7rem,3.4vw,2.4rem);line-height:1.15}
.say-clue{position:absolute;top:16px;right:16px}

/* Fill the gap */
.gap{width:min(100%,980px);margin:0 auto}
.nw{white-space:nowrap}
.bank{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;background:var(--grid);border-radius:22px;padding:14px 20px;margin-bottom:22px}
.bank-label{font-weight:800;color:var(--ink-soft);font-size:.95rem;margin-right:4px}
.wchip{font-family:"Fredoka",sans-serif;font-weight:600;font-size:clamp(1.15rem,2.2vw,1.5rem);padding:10px 26px;border-radius:16px;background:#fff;border:3px solid color-mix(in srgb,var(--c) 40%,white);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 40%,white);transition:transform .1s,box-shadow .1s,background .2s,color .2s}
.wchip:hover{border-color:var(--c)}
.wchip:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--c) 40%,white)}
.wchip.sel{background:var(--c);color:#fff;border-color:var(--c);box-shadow:0 8px 0 color-mix(in srgb,var(--c) 70%,black);transform:translateY(-3px)}
.wchip.used{opacity:.3;box-shadow:none;border-style:dashed;cursor:default;transform:none}
.sheet{display:grid;gap:16px}
.srow{display:grid;grid-template-columns:auto minmax(0,1fr) 64px;align-items:center;gap:16px;padding:12px 20px;background:#fff;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);border-radius:24px;transition:border-color .3s,box-shadow .3s}
.srow.done{border-color:color-mix(in srgb,var(--c) 45%,white);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 45%,white)}
.srow.done .num{background:var(--c)}
.num{width:38px;height:38px;border-radius:50%;background:var(--ink);color:#fff;font-family:"Fredoka",sans-serif;font-weight:700;display:grid;place-items:center}
.stext{font-family:"Fredoka",sans-serif;font-weight:500;font-size:clamp(1.1rem,1.95vw,1.5rem);line-height:2.1}
.blank{position:relative;line-height:1;display:inline-block;vertical-align:middle;min-width:min(172px,42vw);height:54px;margin:0 4px;border-radius:14px;border:3px dashed var(--ink-soft);background:repeating-linear-gradient(-45deg,#fff 0 12px,var(--paper) 12px 24px);font-family:"Fredoka",sans-serif;font-weight:700;font-size:inherit;color:#fff;padding:0 12px;transition:transform .1s,box-shadow .1s}
.blank.active{border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transform:translateY(-2px)}
.blank.filled{background:var(--c);border:3px solid var(--c);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,black);animation:pop .45s cubic-bezier(.3,1.6,.5,1);cursor:default}
.blank.wrongfill{background:var(--berry);border:3px solid var(--berry);box-shadow:0 5px 0 var(--berry-deep);animation:shake .4s}
.thumb{width:64px;height:64px}
.thumb img{display:block;width:64px;height:64px;object-fit:cover;border-radius:16px;border:3px solid var(--c);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}

@media (max-width:760px){
  .gz-stage{grid-template-columns:1fr;justify-items:center;gap:26px}
  .clue-card::before{left:50%;top:-13px;border-bottom:0;border-top:3px solid var(--line);transform:translateX(-50%) rotate(45deg)}
  .mystery{width:clamp(150px,34dvh,230px)} .clue-card{padding:18px 64px 20px 20px;width:100%}
}
@media (min-width:641px) and (max-height:780px){
  .top{padding-top:12px;padding-bottom:10px}
  .brand-badge{width:46px;height:46px;border-radius:14px}
  .gbar{margin-bottom:12px}
  .stage{--w:min(1000px,max(440px,calc((100dvh - 420px) * 4 + 24px)))}
  .panel{margin-top:16px;min-height:0}
  .question{margin-bottom:10px} .look-copy{margin-bottom:10px}
  .feedback{margin:12px 0 4px}
  .opt.pic{width:clamp(72px,11dvh,100px)} .opt.txt{padding:12px 30px}
  .toolbar{margin-bottom:16px} .deck{gap:14px}
  .mystery{width:clamp(150px,calc(100dvh - 470px),260px)} .clue-card{padding-top:16px;padding-bottom:18px}
  .bank{padding:10px 20px;margin-bottom:14px} .wchip{padding:7px 24px}
  .sheet{gap:11px} .srow{padding:7px 20px;grid-template-columns:auto minmax(0,1fr) 54px}
  .blank{height:46px} .num{width:34px;height:34px} .thumb,.thumb img{width:54px;height:54px}
}
@media (min-width:641px) and (max-height:660px){
  .top{padding-top:8px;padding-bottom:6px}
  .gap .look-copy{margin-bottom:6px!important;font-size:1rem}
  .bank{padding:8px 18px;margin-bottom:10px}
  .sheet{gap:9px} .srow{padding:4px 18px}
  .blank{height:42px} .stext{line-height:1.9}
  .feedback{margin:8px 0 0}
  main{padding-bottom:16px}
}
@media (max-width:640px){
  .deck{grid-template-columns:repeat(2,1fr);gap:14px}
  .tab span{display:none} .tab{padding:10px 16px}
  .stage{gap:12px;grid-template-columns:repeat(2,1fr)} .tile{border-radius:16px}
  .opt.txt{padding:12px 22px;min-width:110px}
  .options{gap:14px}
  .panel{margin-top:20px}
  main{padding-bottom:32px}
  .sound-toggle{right:12px;top:14px;bottom:auto;width:44px;height:44px;padding:0;display:grid;place-items:center}
  .brand{padding-right:52px}
  .srow{grid-template-columns:auto minmax(0,1fr);gap:12px;padding:10px 14px} .thumb{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="brand-badge"><svg viewBox="0 0 24 24" fill="none" stroke="#1E2B4F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5.5h6a3 3 0 0 1 3 3V20a2.5 2.5 0 0 0-2.5-2.5H3z"/><path d="M21 5.5h-6a3 3 0 0 0-3 3V20a2.5 2.5 0 0 1 2.5-2.5H21z"/></svg></div>
    <div><small>Look 4</small><h1>Unit 5 – L3 Reading</h1></div>
  </div>
  <nav class="tabs" role="tablist" id="tabs" aria-label="Activities"></nav>
</header>
<main>
  <section class="view" id="v-flash" role="tabpanel">
    <div class="toolbar">
      <button class="btn" id="b-pics">Show all pictures</button>
      <button class="btn" id="b-words">Show all words</button>
      <button class="btn" id="b-shuf">Shuffle</button>
      <span class="hint">Tap a card to flip it</span>
    </div>
    <div class="deck" id="deck"></div>
  </section>
  <section class="view" id="v-guess" role="tabpanel" hidden></section>
  <section class="view" id="v-gap" role="tabpanel" hidden></section>
  <section class="view" id="v-miss" role="tabpanel" hidden></section>
</main>

/* ---------- sound ---------- */
let soundOn=true, actx=null;
function tone(freqs,dur=.12,type="sine",vol=.18){ if(!soundOn) return; try{
  actx=actx||new (window.AudioContext||window.webkitAudioContext)(); let t=actx.currentTime;
  freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain(); o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.85;});}catch(e){} }
const sfx={flip:()=>tone([660],.08,"triangle",.12), good:()=>tone([523,659,784,1047],.13,"triangle",.2),
  bad:()=>tone([300,220],.18,"sawtooth",.08), whoosh:()=>tone([440,330,262],.1,"sine",.12)};
function say(word){ if(!soundOn||!("speechSynthesis" in window)) return; try{ speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word); u.lang="en-US"; u.rate=.85;
  const v=speechSynthesis.getVoices().find(v=>/^en(-|_)(US|GB)/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u);}catch(e){} }
const soundBtn=$('#sound');
function paintSound(){ soundBtn.innerHTML=ic(soundOn?'speaker':'mute'); soundBtn.setAttribute('aria-label',soundOn?'Sound on':'Sound off'); soundBtn.setAttribute('aria-pressed',soundOn); }
soundBtn.onclick=()=>{ soundOn=!soundOn; if(!soundOn&&"speechSynthesis" in window) try{speechSynthesis.cancel()}catch(e){} paintSound(); sfx.flip(); };
paintSound();

/* ---------- shared helpers ---------- */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const col=id=>`--c:var(--c-${id})`;
const wordColor=id=>getComputedStyle(document.documentElement).getPropertyValue('--c-'+id).trim();

function spacedSeq(items,rounds,gap,avoid=()=>false){ const seq=[],used=new Map(items.map(i=>[i,0]));
  for(let r=0;r<rounds;r++){ const recent=seq.slice(-gap), prev=seq[seq.length-1];
    let pool=items.filter(i=>!recent.includes(i));
    const min=Math.min(...pool.map(i=>used.get(i))); pool=pool.filter(i=>used.get(i)===min);
    const far=pool.filter(i=>prev===undefined||!avoid(i,prev)); if(far.length) pool=far;
    const pick=pool[Math.random()*pool.length|0]; seq.push(pick); used.set(pick,used.get(pick)+1);} return seq; }

function burst(host,color,n=18,top='50%'){
  if(!host||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  const c=document.createElement('div'); c.className='confetti'; c.style.left='50%'; c.style.top=top;
  const cols=['#FFC93C','#25A96A',color,'#1E2B4F','#FFC93C',color];
  const r=host.getBoundingClientRect(), cx=r.left+r.width/2, lo=14-cx, hi=innerWidth-14-cx;
  for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, d=70+Math.random()*100, el=document.createElement('i');
    el.style.cssText=`--k:${cols[i%cols.length]};--x:${Math.min(hi,Math.max(lo,Math.cos(a)*d)).toFixed(0)}px;--y:${(Math.sin(a)*d-30).toFixed(0)}px;--r:${(Math.random()*720-360)|0}deg;--d:${(Math.random()*90)|0}ms`;
    c.appendChild(el); }
  host.appendChild(c); setTimeout(()=>c.remove(),1300);
}

function starCount(got,total){ return got>=total-1?3:got>=Math.ceil(total*.6)?2:got>=Math.ceil(total*.3)?1:0; }
function showResult(root,o){
  const n=starCount(o.got,o.total), head=o.got===o.total?o.perfect:n>=3?'Super!':n===2?'Good work!':'Nice try!';
  root.innerHTML=`<div class="result"><div class="stars">${[0,1,2].map(i=>starSvg(i<n,true)).join('')}</div><h2>${head}</h2><p>${o.sub}</p><div class="row"><button class="btn btn-primary" data-act="again">${ic('replay')} Play again</button><button class="btn" data-act="back">Back to flashcards</button></div></div>`;
  const res=$('.result',root);
  $('[data-act=again]',root).onclick=o.again; $('[data-act=back]',root).onclick=o.back;
  $('[data-act=again]',root).focus({preventScroll:true});
  if(n>=3){ burst(res,'#E0662B',34,'22%'); sfx.good(); }
}
const dotsHtml=(n,cur,done,wordAt=()=>false)=>Array.from({length:n},(_,j)=>`<span class="dot${wordAt(j)?' word':''}${j===cur?' cur':''}${done[j]===true?' ok':done[j]===false?' no':''}"></span>`).join('');
function bumpScore(el,val){ el.innerHTML=starSvg(true)+' '+val; el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function show(v){

const deck=$('#deck'); let order=[...WORDS];
function syncBtns(){ const cards=$$('.fc',deck), n=cards.filter(c=>c.classList.contains('is-word')).length;
  $('#b-words').classList.toggle('is-on',n===cards.length); $('#b-pics').classList.toggle('is-on',n===0); }
function renderDeck(anim){
  deck.classList.toggle('dealing',!!anim);
  deck.innerHTML=order.map((w,i)=>`<div class="fc" style="${col(w)};--i:${i}" data-w="${w}"><div class="fc-inner"><div class="face face-pic"><img class="ph" src="${IMGFC[w]}" alt=""></div><div class="face face-word"><img class="avatar" src="${IMGFC[w]}" alt=""><span>${w}</span></div></div><button class="flip" aria-label="Flip card"></button><button class="speak" aria-label="Say ${w}">${ic('speaker')}</button></div>`).join('');
  if(anim) setTimeout(()=>deck.classList.remove('dealing'),900);
  syncBtns();
}
deck.addEventListener('click',e=>{
  const card=e.target.closest('.fc'); if(!card) return;
  if(e.target.closest('.speak')){ say(card.dataset.w); return; }
  if(e.target.closest('.flip')){ card.classList.toggle('is-word'); sfx.flip(); if(card.classList.contains('is-word')) say(card.dataset.w); syncBtns(); }
});
$('#b-pics').onclick=()=>$$('.fc',deck).forEach((c,i)=>setTimeout(()=>{c.classList.remove('is-word');syncBtns()},i*70));
$('#b-words').onclick=()=>$$('.fc',deck).forEach((c,i)=>setTimeout(()=>{c.classList.add('is-word');sfx.flip();syncBtns()},i*70));
$('#b-shuf').onclick=()=>{ const prev=order.join(); let o; do{ o=shuffle(WORDS) }while(o.join()===prev); order=o; sfx.whoosh(); renderDeck(true); };

const G=[

let guess={};
function guessStart(){
  const pos=spacedSeq([0,1,2],G.length,1);
  const qs=shuffle(G.map((q,i)=>i)).map((gi,i)=>{ const q=G[gi]; const rest=shuffle(q.opts.filter((_,k)=>k!==q.ans)); let r=0;
    return {...q,id:q.opts[q.ans].id,opts:[0,1,2].map(k=>k===pos[i]?q.opts[q.ans]:rest[r++]),ans:pos[i]}; });
  guess={qs,i:0,score:0,done:[],locked:false}; renderGuess();
}
function renderGuess(){
  const g=guess, q=g.qs[g.i], L='ABC';
  $('#v-guess').innerHTML=`<div class="game"><div class="gbar"><div class="round-label"><span>Question ${g.i+1} of ${g.qs.length}</span><span class="chip">${ic('bulb')} Read the clue</span></div><div class="dots">${dotsHtml(g.qs.length,g.i,g.done)}</div><div class="score" id="g-score">${starSvg(true)} ${g.score}</div></div>
  <div class="gz-stage"><div class="tile mystery missing" id="g-tile" style="${col(q.id)}"><b>?</b></div>
  <div class="clue-card"><button class="btn btn-icon say-clue" aria-label="Read the clue aloud">${ic('speaker')}</button><p class="clue-text">${q.clue}</p><p class="clue-q">${q.q}</p></div></div>
  <div class="panel"><div class="options">${q.opts.map((o,k)=>`<button class="opt txt" data-k="${k}" aria-label="Option ${L[k]}: ${o.t}"><span class="key">${L[k]}</span>${o.t}</button>`).join('')}</div><div class="feedback" id="g-fb" aria-live="polite"></div></div></div>`;
  g.locked=false;
}
function guessPick(k){
  const g=guess; if(g.locked) return; g.locked=true;
  const q=g.qs[g.i], ok=k===q.ans, root=$('#v-guess'), opts=$$('.opt',root);
  opts.forEach(b=>b.disabled=true); opts[q.ans].classList.add('ok'); if(!ok) opts[k].classList.add('no');
  const tile=$('#g-tile'); tile.className='tile mystery reveal'+(ok?'':' wrong'); tile.style.cssText=col(q.id);
  tile.innerHTML=`<img class="ph" src="${IMG[q.id]}" alt=""><span class="cap">${q.id}</span>`;
  g.done[g.i]=ok; $$('.dot',root)[g.i].classList.add(ok?'ok':'no');
  if(ok){ g.score++; bumpScore($('#g-score'),g.score); burst(tile,wordColor(q.id)); sfx.good(); } else sfx.bad();
  say(q.id);
  const last=g.i===g.qs.length-1, fb=$('#g-fb'); fb.className='feedback '+(ok?'good':'bad');
  fb.innerHTML=`<span>${ok?'Great job!':'Oops!'} It's ${q.id}.</span><button class="btn" data-next>${last?'See results':'Next question'} ${ic('next')}</button>`;
  $('[data-next]',fb).focus({preventScroll:true});
}
$('#v-guess').addEventListener('click',e=>{
  const b=e.target.closest('.opt'); if(b&&!b.disabled){ guessPick(+b.dataset.k); return; }
  if(e.target.closest('.say-clue')){ const q=guess.qs[guess.i]; say(q.clue+' '+q.q); return; }
  if(e.target.closest('[data-next]')){
    if(guess.i>=guess.qs.length-1) showResult($('#v-guess'),{got:guess.score,total:guess.qs.length,sub:`You got ${guess.score} out of ${guess.qs.length}.`,perfect:'Perfect!',again:guessStart,back:backToFlash});
    else { guess.i++; renderGuess(); }
  }
});

/* ---------- Fill the gap ---------- */
/* Placeholder sentences (original text) – replace with the book's exercise */
const GAPSETS=[{bank:['exciting','dangerous','important','popular'],rows:[
 {pre:"It's fun to fly in a balloon. It's",post:'!',ans:'exciting'},
 {pre:'Be careful on the icy mountain. It is',post:'!',ans:'dangerous'},
 {pre:'The pyramid is very old. It is',post:'for history.',ans:'important'},
 {pre:'Millions of people visit the Taj Mahal. It is',post:'.',ans:'popular'}]}];
const FLASH_ORDER=WORDS.join();
function shuffledRows(S,prev){ let r; do{ r=shuffle(S.rows); }while(r.map(x=>x.ans).join()===FLASH_ORDER||(prev&&r.map(x=>x.ans).join()===prev)); return r; }
function shuffledBank(S,rows){ const ans=rows.map(r=>r.ans).join(); let b; do{ b=shuffle(S.bank); }while(b.join()===ans||b.join()===FLASH_ORDER); return b; }
let gap={};
function gapStart(){ gap={set:0,score:0,total:GAPSETS.reduce((n,s)=>n+s.rows.length,0)}; gapRender(); }
function gapRender(){
  const S=GAPSETS[gap.set];
  gap.rows=shuffledRows(S,gap.prevRows); gap.prevRows=gap.rows.map(x=>x.ans).join(); gap.bank=shuffledBank(S,gap.rows); gap.sel=null; gap.act=null; gap.lock=false; gap.missed=gap.rows.map(()=>false); gap.done=gap.rows.map(()=>false);
  $('#v-gap').innerHTML=`<div class="gap"><p class="look-copy" style="text-align:center;margin-bottom:12px">Tap a word, then tap a gap.</p>
  <div class="bank"><span class="bank-label">Word bank</span>${gap.bank.map(id=>`<button class="wchip" data-id="${id}" style="${col(id)}">${id}</button>`).join('')}</div>
  <div class="sheet">${gap.rows.map((r,i)=>{ const lead=r.post.match(/^[.,!?]*/)[0], rest=r.post.slice(lead.length).trim();
    return `<div class="srow" data-i="${i}" style="${col(r.ans)}"><span class="num">${i+1}</span><p class="stext">${r.pre} <span class="nw"><button class="blank" data-i="${i}" aria-label="Gap ${i+1}"></button>${lead}</span>${rest?' '+rest:''}</p><div class="thumb"></div></div>`; }).join('')}</div>
  <div class="feedback" id="p-fb" aria-live="polite"></div></div>`;
}
function gapTry(i,id){
  const r=gap.rows[i], root=$('#v-gap'), blank=$(`.blank[data-i="${i}"]`,root), row=$(`.srow[data-i="${i}"]`,root), fb=$('#p-fb',root);
  const chip=$(`.wchip[data-id="${id}"]`,root);
  blank.textContent=id;
  if(id===r.ans){
    blank.classList.remove('active'); blank.classList.add('filled'); blank.disabled=true; gap.done[i]=true;
    row.classList.add('done'); $('.thumb',row).innerHTML=`<img src="${IMG[r.ans]}" alt="">`;
    chip.classList.remove('sel'); chip.classList.add('used'); chip.disabled=true;
    if(!gap.missed[i]) gap.score++;
    gap.sel=null; gap.act=null; fb.className='feedback'; fb.textContent='';
    say(`${r.pre} ${r.ans}${/^[.,!?]/.test(r.post)?'':' '}${r.post}`); sfx.good(); burst(blank,wordColor(r.ans),12);
    if(gap.done.every(Boolean)){
      const last=gap.set===GAPSETS.length-1; fb.className='feedback good';
      fb.innerHTML=`<span>Great job! ${last?'All done.':`Set ${gap.set+1} is done.`}</span><button class="btn" data-next>${last?'See results':'Next set'} ${ic('next')}</button>`;
      $('[data-next]',fb).focus({preventScroll:true});
    }
  } else {
    gap.lock=true; gap.missed[i]=true; blank.classList.remove('active'); blank.classList.add('wrongfill');
    fb.className='feedback bad'; fb.textContent='Not quite. Try again!'; sfx.bad();
    setTimeout(()=>{ blank.classList.remove('wrongfill'); blank.textContent=''; chip.classList.remove('sel'); fb.className='feedback'; fb.textContent=''; gap.sel=null; gap.act=null; gap.lock=false; },750);
  }
}
$('#v-gap').addEventListener('click',e=>{
  const root=$('#v-gap');
  if(e.target.closest('[data-next]')){
    if(gap.set>=GAPSETS.length-1) showResult(root,{got:gap.score,total:gap.total,sub:`You got ${gap.score} out of ${gap.total} on the first try.`,perfect:'Perfect!',again:gapStart,back:backToFlash});
    else { gap.set++; gapRender(); }
    return;
  }
  if(gap.lock) return;
  const chip=e.target.closest('.wchip'), blank=e.target.closest('.blank');
  if(chip&&!chip.disabled){
    const id=chip.dataset.id;
    if(gap.sel===id){ gap.sel=null; chip.classList.remove('sel'); return; }
    $$('.wchip',root).forEach(c=>c.classList.remove('sel')); gap.sel=id; chip.classList.add('sel'); sfx.flip();
    if(gap.act!==null) gapTry(gap.act,id);
  } else if(blank&&!blank.disabled){
    const i=+blank.dataset.i; if(gap.done[i]) return;
    if(gap.act===i){ gap.act=null; blank.classList.remove('active'); return; }
    $$('.blank',root).forEach(b=>b.classList.remove('active')); gap.act=i; blank.classList.add('active'); sfx.flip();
    if(gap.sel) gapTry(i,gap.sel);
  }
});

/* ---------- What's missing? ---------- */
const ROUNDS=8, COLS=4;
const adj=(a,b)=>Math.abs((a/COLS|0)-(b/COLS|0))+Math.abs(a%COLS-b%COLS)===1;
const modeOf=r=>r%2===0?'pic':'word';
let miss={};
function missStart(){
  miss={r:0,score:0,targets:spacedSeq(WORDS,ROUNDS,2),slots:spacedSeq([0,1,2,3],ROUNDS,2,adj),done:[],prevD:[],tok:0,locked:true,phase:'look'};
  missRound();
}
const mTile=(w,mode,extra='')=>mode==='pic'?`<div class="tile" style="${col(w)};${extra}"><img class="ph" src="${IMG[w]}" alt=""></div>`:`<div class="tile word" style="${col(w)};${extra}"><span>${w}</span></div>`;
function missRound(){
  const m=miss, mode=modeOf(m.r); m.tok++; m.locked=true; m.phase='look';
  $('#v-miss').innerHTML=`<div class="game"><div class="gbar"><div class="round-label"><span>Round ${m.r+1} of ${ROUNDS}</span><span class="chip">${ic(mode==='pic'?'pic':'words')} ${mode==='pic'?'Pictures':'Words'}</span></div><div class="dots">${dotsHtml(ROUNDS,m.r,m.done,modeOf&&(j=>modeOf(j)==='word'))}</div><div class="score" id="m-score">${starSvg(true)} ${m.score}</div></div>
  <div class="stage-wrap"><div class="stage dealing" id="m-stage"></div><div class="curtain" id="m-curtain"><div class="curtain-inner">${eyesSvg}<p>Close your eyes!</p><div class="count" id="m-count">3</div></div></div></div>
  <div class="panel" id="m-panel"></div></div>`;
  let lo; do{ lo=shuffle(WORDS); }while(lo.join()===FLASH_ORDER||lo.join()===m.prevLook); m.prevLook=lo.join(); m.order=lo;
  $('#m-stage').innerHTML=m.order.map((w,i)=>mTile(w,mode,`animation-delay:${i*45}ms`)).join('');
  setTimeout(()=>{ const s=$('#m-stage'); s&&s.classList.remove('dealing'); },900);
  $('#m-panel').innerHTML=`<p class="look-copy">Look at the ${mode==='pic'?'pictures':'words'} carefully. Say them out loud!</p><button class="btn btn-primary" id="m-hide">${ic('eye')} Hide one!</button>`;
  m.locked=false;
}
function missHide(){
  const m=miss; if(m.phase!=='look') return; m.phase='count'; m.locked=true; const tok=++m.tok; sfx.whoosh();
  const cur=$('#m-curtain'), cnt=$('#m-count'); cur.classList.add('down'); $('#m-panel').innerHTML='';
  const alive=()=>m.tok===tok;
  setTimeout(()=>{ if(alive()){ cnt.textContent='2'; sfx.flip(); } },800);
  setTimeout(()=>{ if(alive()){ cnt.textContent='1'; sfx.flip(); } },1600);
  setTimeout(()=>{ if(alive()) missBuild(); },2400);
}
function missBuild(){
  const m=miss, mode=modeOf(m.r), target=m.targets[m.r], slot=m.slots[m.r];
  const others=shuffle(WORDS.filter(w=>w!==target)); const ord=others.slice(); ord.splice(slot,0,null); m.order=ord;
  const stage=$('#m-stage'); stage.dataset.target=target; stage.dataset.slot=slot; stage.classList.add('dealing');
  stage.innerHTML=ord.map((w,i)=>w===null?`<div class="tile missing" id="m-hole" style="animation-delay:${i*45}ms"><b>?</b></div>`:mTile(w,mode,`animation-delay:${i*45}ms`)).join('');
  setTimeout(()=>{ const s=$('#m-stage'); s&&s.classList.remove('dealing'); },900);
  $('#m-curtain').classList.remove('down');
  let d=shuffle(others.filter(w=>!m.prevD.includes(w))).slice(0,2);
  if(d.length<2) d=d.concat(shuffle(others.filter(w=>!d.includes(w))).slice(0,2-d.length));
  m.prevD=d; let oo; do{ oo=shuffle([target,...d]); }while(oo.slice().sort((a,b)=>WORDS.indexOf(a)-WORDS.indexOf(b)).join()===oo.join()); m.opts=oo;
  $('#m-panel').innerHTML=`<p class="question">What's missing?</p><div class="options">${m.opts.map((id,k)=>mode==='pic'?`<button class="opt pic" data-id="${id}" aria-label="Option ${k+1}"><span class="key">${k+1}</span><img class="ph" src="${IMG[id]}" alt=""></button>`:`<button class="opt txt" data-id="${id}" aria-label="Option ${k+1}: ${id}"><span class="key">${k+1}</span>${id}</button>`).join('')}</div><div class="feedback" id="m-fb" aria-live="polite"></div>`;
  m.phase='guess'; m.locked=false;
}
function missPick(btn){
  const m=miss; if(m.locked||m.phase!=='guess') return; m.locked=true; m.phase='answered';
  const mode=modeOf(m.r), target=m.targets[m.r], id=btn.dataset.id, ok=id===target, root=$('#v-miss'), opts=$$('.opt',root);
  opts.forEach(b=>{ b.disabled=true; if(b.dataset.id===target) b.classList.add('ok'); }); if(!ok) btn.classList.add('no');
  const hole=$('#m-hole'); hole.className='tile reveal'+(mode==='word'?' word':'')+(ok?'':' wrong'); hole.style.cssText=col(target);
  hole.innerHTML=mode==='pic'?`<img class="ph" src="${IMG[target]}" alt="">`:`<span>${target}</span>`; hole.removeAttribute('id');
  m.done[m.r]=ok; $$('.dot',root)[m.r].classList.add(ok?'ok':'no');
  if(ok){ m.score++; bumpScore($('#m-score'),m.score); burst(hole,wordColor(target)); sfx.good(); } else sfx.bad();
  say(target);
  const last=m.r===ROUNDS-1, fb=$('#m-fb'); fb.className='feedback '+(ok?'good':'bad');
  fb.innerHTML=`<span>${ok?'Great job!':'Oops!'} It's ${target}.</span><button class="btn" data-next>${last?'See results':'Next round'} ${ic('next')}</button>`;
  $('[data-next]',fb).focus({preventScroll:true});
}
$('#v-miss').addEventListener('click',e=>{
  if(e.target.closest('#m-hide')){ missHide(); return; }
  const b=e.target.closest('.opt'); if(b&&!b.disabled){ missPick(b); return; }
  if(e.target.closest('[data-next]')){
    if(miss.r>=ROUNDS-1) showResult($('#v-miss'),{got:miss.score,total:ROUNDS,sub:`You got ${miss.score} out of ${ROUNDS}.`,perfect:'Perfect memory!',again:missStart,back:backToFlash});
    else { miss.r++; missRound(); }
  }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return; const k=e.key.toLowerCase();
  if(curView==='guess'&&!guess.locked&&guess.qs){ const i='abc'.indexOf(k)>=0?'abc'.indexOf(k):'123'.indexOf(k); if(i>=0){ e.preventDefault(); guessPick(i); } }
  else if(curView==='miss'&&miss.phase==='guess'&&!miss.locked){ const i='123'.indexOf(k); if(i>=0){ const b=$$('#v-miss .opt')[i]; if(b){ e.preventDefault(); missPick(b); } } }
});
</script>
